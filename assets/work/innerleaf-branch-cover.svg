" y="409" fill="#35513f" font-size="22" font-weight="700">What am I</text><text x="880" y="440" fill="#35513f" font-size="22" font-weight="700">assuming?</text><rect x="482" y="564" width="315" height="92" rx="24" fill="#254e3b"/><text x="524" y="600" fill="#bbdac3" font-size="16" letter-spacing="2">03 · NEXT STEP</text><text x="523" y="635" fill="white" font-size="23" font-weight="700">Choose with clarity</text><circle cx="640" cy="289" r="28" fill="#457c5a"/><path d="M642 270Q620 290 637 309Q662 309 659 274Q646 274 642 270Z" fill="#c8e9cb"/><path d="M638 309L649 285" stroke="#457c5a" stroke-width="3"/></g></svg>
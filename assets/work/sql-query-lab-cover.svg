<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Database and SQL interactive query lab</title><desc id="d">Original illustrative SQL editor and sample query result showing data relationships and aggregation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151728"/><stop offset="1" stop-color="#3b2959"/></linearGradient></defs><rect width="1200" height="700" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="65" y="77" fill="#c5abf5" font-size="19" font-weight="750" letter-spacing="4">DATABASE &amp; SQL · CASE 05</text><text x="65" y="154" fill="#fff" font-size="52" font-weight="750">Query the business question.</text><text x="65" y="197" fill="#c6c6da" font-size="20">Relational joins → results → integrity checks</text></g><rect x="65" y="246" width="668" height="372" rx="18" fill="#0e1b2f"/><rect x="65" y="246" width="668" height="50" rx="18" fill="#1c3045"/><rect x="65" y="284" width="668" height="12" fill="#1c3045"/><g font-family="ui-monospace,Consolas,monospace" font-size="21"><text x="94" y="280" fill="#b6becd" font-size="16">customer_totals.sql</text><text x="98" y="350" fill="#78c7fa">SELECT</text><text x="199" y="350" fill="#e6eef9">c.name,</text><text x="98" y="401" fill="#c5a8f9">SUM</text><text x="145" y="401" fill="#e6eef9">(oi.quantity * p.price)</text><text x="98" y="452" fill="#78c7fa">FROM</text><text x="171" y="452" fill="#d8efb0">customers c</text><text x="98" y="503" fill="#78c7fa">JOIN</text><text x="171" y="503" fill="#d8efb0">orders o</text><text x="98" y="554" fill="#78c7fa">GROUP BY</text><text x="235" y="554" fill="#e6eef9">c.name;</text></g><rect x="769" y="246" width="366" height="372" rx="18" fill="#f8f9ff"/><rect x="769" y="246" width="366" height="52" rx="18" fill="#ecebfb"/><rect x="769" y="285" width="366" height="13" fill="#ecebfb"/><g font-family="Inter,Arial,sans-serif"><text x="796" y="280" fill="#4a4267" font-size="17" font-weight="700">RESULT · 3 ROWS</text><text x="799" y="350" fill="#667189" font-size="17" font-weight="700">CUSTOMER</text><text x="1054" y="350" fill="#667189" font-size="17" font-weight="700">SPEND</text><path d="M791 371H1109M791 442H1109M791 513H1109M791 584H1109" stroke="#dfe1ec" stroke-width="2"/><text x="800" y="413" fill="#293651" font-size="19">Acme Studio</text><text x="1046" y="413" fill="#6352a3" font-size="19" font-weight="700">$185</text><text x="800" y="484" fill="#293651" font-size="19">Beacon Retail</text><text x="1046" y="484" fill="#6352a3" font-size="19" font-weight="700">$100</text><text x="800" y="555" fill="#293651" font-size="19">Cove Supply</text><text x="1059" y="555" fill="#6352a3" font-size="19" font-weight="700">$45</text></g><text x="67" y="665" fill="#c9bce0" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2">REPRESENTATIVE SCHEMA · FICTIONAL RESULTS</text></svg>
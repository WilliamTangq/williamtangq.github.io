<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#eef3fa"/><text x="68" y="83" fill="#7955a2" font-family="Arial,sans-serif" font-size="21">IT STRATEGY &amp; GOVERNANCE · ACADEMIC PROPOSAL</text><text x="68" y="152" fill="#172b49" font-family="Arial,sans-serif" font-size="43" font-weight="700">Make approval evidence traceable.</text><rect x="68" y="205" width="1064" height="108" rx="12" fill="white"/><rect x="68" y="205" width="5" height="108" rx="2" fill="#7955a2"/><text x="100" y="244" fill="#172b49" font-family="Arial,sans-serif" font-size="26" font-weight="700">Validate the evidence</text><text x="100" y="282" fill="#5d6878" font-family="Arial,sans-serif" font-size="22">Check completeness before a record advances.</text><rect x="68" y="335" width="1064" height="108" rx="12" fill="white"/><rect x="68" y="335" width="5" height="108" rx="2" fill="#7955a2"/><text x="100" y="374" fill="#172b49" font-family="Arial,sans-serif" font-size="26" font-weight="700">Separate the review</text><text x="100" y="412" fill="#5d6878" font-family="Arial,sans-serif" font-size="22">Make independent review and approval responsibilities explicit.</text><rect x="68" y="465" width="1064" height="108" rx="12" fill="white"/><rect x="68" y="465" width="5" height="108" rx="2" fill="#7955a2"/><text x="100" y="504" fill="#172b49" font-family="Arial,sans-serif" font-size="26" font-weight="700">Monitor exceptions</text><text x="100" y="542" fill="#5d6878" font-family="Arial,sans-serif" font-size="22">Keep an issue trail and define follow-up evidence.</text><text x="68" y="632" fill="#627287" font-family="Arial,sans-serif" font-size="18">Portfolio workflow summary · not an application screenshot</text></svg>